<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DreamPath AI – Every learner deserves the chance to dream bigger</title>
<style>
:root{--n:#0a1f44;--b:#1d4ed8;--l:#e8f0fe;--g:#5b6b86;--ok:#15803d;--bad:#b91c1c;--r:16px}
*{box-sizing:border-box}body{margin:0;font:16px/1.55 "Trebuchet MS",Verdana,sans-serif;color:var(--n);background:#f5f8ff}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;line-height:1.2;margin:.2em 0 .5em}
header{background:var(--n);color:#fff;position:sticky;top:0;z-index:9;padding:10px 18px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.logo{font:700 20px Georgia,serif;margin-right:auto;cursor:pointer;display:flex;gap:8px;align-items:center}
nav{display:flex;flex-wrap:wrap;gap:4px}
nav button{background:none;border:0;color:#cfdcff;padding:7px 11px;border-radius:99px;cursor:pointer;font:inherit;font-size:14px}
nav button.on,nav button:hover{background:var(--b);color:#fff}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #60a5fa;outline-offset:2px}
.demo{background:var(--l);border-bottom:1px solid #c7d7fb;padding:8px 18px;font-size:14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.demo b{color:var(--b)}main{max-width:1100px;margin:0 auto;padding:22px 16px 60px}
.card{background:#fff;border:1px solid #dbe5fb;border-radius:var(--r);padding:18px;margin-bottom:16px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.btn{background:var(--b);color:#fff;border:0;border-radius:10px;padding:10px 18px;font:inherit;font-weight:700;cursor:pointer}
.btn.alt{background:#fff;color:var(--b);border:2px solid var(--b)}.btn.sm{padding:5px 11px;font-size:13px}.btn.red{background:var(--bad)}
.btn:hover{filter:brightness(1.1)}
.hero{background:linear-gradient(135deg,var(--n),#1e40af);color:#fff;border-radius:24px;padding:48px 28px;margin-bottom:20px}
.hero h1{font-size:clamp(30px,5vw,50px);max-width:16em}.hero p{max-width:40em;color:#d6e2ff}
.tag{display:inline-block;background:var(--l);color:var(--b);border-radius:99px;padding:2px 10px;font-size:12px;font-weight:700}
.tag.w{background:#fef3c7;color:#92400e}.tag.g{background:#dcfce7;color:var(--ok)}
label{display:block;font-weight:700;font-size:14px;margin:10px 0 4px}
input,select,textarea{width:100%;padding:9px 11px;border:1px solid #b8c7e8;border-radius:10px;font:inherit;background:#fff;color:var(--n)}
.err{color:var(--bad);font-size:14px;min-height:20px;margin-top:6px}
.bar{background:var(--l);border-radius:99px;height:12px;overflow:hidden}.bar i{display:block;height:100%;background:var(--b);border-radius:99px}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.item{border-top:1px solid #e3ebfb;padding:10px 0}.item:first-child{border-top:0}
.muted{color:var(--g);font-size:14px}.empty{background:var(--l);border-radius:12px;padding:16px;text-align:center;color:var(--g)}
.donut{width:130px;height:130px;border-radius:50%;display:grid;place-items:center;margin:auto}
.donut span{background:#fff;width:90px;height:90px;border-radius:50%;display:grid;place-items:center;font:700 22px Georgia,serif}
.q{margin-bottom:14px}.q label{font-weight:400;display:flex;gap:8px;align-items:center;margin:4px 0}.q input{width:auto}
.good{color:var(--ok);font-weight:700}.bad{color:var(--bad);font-weight:700}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--n);color:#fff;padding:11px 20px;border-radius:12px;opacity:0;transition:.3s;pointer-events:none;z-index:20;max-width:90%}
#toast.on{opacity:1}
#modal{position:fixed;inset:0;background:rgba(10,31,68,.6);display:none;align-items:flex-start;justify-content:center;overflow-y:auto;padding:20px 12px;z-index:15}
#modal.on{display:flex}#modal .box{background:#fff;border-radius:var(--r);padding:20px;width:100%;max-width:520px;margin:auto}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.edited{font-size:12px;color:var(--g)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<header><div class="logo" onclick="go('home')" role="button" tabindex="0"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#60a5fa" stroke-width="2.4" stroke-linecap="round"><path d="M3 20c4-1 6-5 8-9s5-6 10-7"/><path d="M16 4h5v5"/></svg>DreamPath AI</div>
<nav id="nav"></nav></header>
<div class="demo">⚠ <b>Demonstration environment</b> – all learners, scores and opportunities are fictional. Data is stored only in this browser (localStorage), which is not a secure database.
<label style="margin:0;display:flex;gap:6px;align-items:center">View as <select id="role" style="width:auto" onchange="setRole(this.value)"><option value="teacher">Teacher</option><option value="parent">Parent/Guardian</option><option value="learner">Learner</option></select></label></div>
<main id="main"></main><div id="toast" role="status" aria-live="polite"></div>
<div id="modal" role="dialog" aria-modal="true" aria-labelledby="mt" onclick="if(event.target===this)closeM()"><div class="box"><h2 id="mt">Edit assignment</h2>
<form id="ef" onsubmit="saveEdit(event)" novalidate><label for="et">Title</label><input id="et" maxlength="80"><label for="es">Subject</label><select id="es"></select><label for="ei">Instructions</label><textarea id="ei" rows="4"></textarea><label for="ed">Due date</label><input type="date" id="ed"><div class="err" id="eerr" role="alert"></div>
<div class="btns"><button class="btn">Save changes</button><button type="button" class="btn alt" onclick="closeM()">Cancel</button></div></form></div></div>
<script>
const SUBJ=["Mathematics","Science","English","Geography"];
const BASE={Mathematics:{Fractions:85,Algebra:55,Geometry:70},Science:{Cells:80,Forces:50,Energy:65},English:{Comprehension:75,Grammar:60,Writing:68},Geography:{}};
const QZ={Mathematics:[["Fractions","What is 3/4 + 1/4?",["1","1/2","4/8"],0],["Algebra","Solve x + 5 = 12",["x = 7","x = 17","x = 5"],0],["Geometry","Angles in a triangle add up to…",["90°","180°","360°"],1]],
Science:[["Cells","Which organelle releases energy?",["Nucleus","Mitochondria","Ribosome"],1],["Forces","What is the unit of force?",["Newton","Joule","Watt"],0],["Energy","Energy of a moving object is…",["Potential","Kinetic","Thermal"],1]],
English:[["Comprehension","A text's main idea is…",["A minor detail","Its central point","Only the title"],1],["Grammar","Which word is a noun?",["Run","Quickly","River"],2],["Writing","A good paragraph has…",["One main idea","No structure","Only questions"],0]],
Geography:[["Maps","Lines running east–west are…",["Longitude","Latitude","Meridians"],1],["Climate","Climate is…",["A long-term pattern","Today's forecast","A storm"],0],["Rivers","Where a river begins is its…",["Mouth","Source","Delta"],1]]};
const FB={Mathematics:"Good effort with fractions. Show your working in algebra steps.",Science:"Strong on cells. Revisit forces with real-life examples.",English:"Clear ideas. Proofread for grammar before submitting.",Geography:"Not yet assessed – a diagnostic quiz will help me plan."};
const TESTS=[["Mathematics test","Fractions, Algebra",9],["Science quiz","Forces, Energy",14]];
const CAR=[{id:"dev",n:"Software Developer",d:"Designs and builds apps, websites and tools people use daily.",s:"Mathematics, English",p:"Coding club → IT diploma or Computer Science degree → junior developer"},
{id:"doc",n:"Doctor",d:"Diagnoses illness and cares for patients in clinics and hospitals.",s:"Science, Mathematics",p:"Strong Science marks → medical degree → internship → specialisation"},
{id:"eng",n:"Civil Engineer",d:"Plans bridges, roads and water systems for communities.",s:"Mathematics, Geography",p:"Maths and Science focus → engineering degree → graduate programme"},
{id:"tch",n:"Teacher",d:"Helps learners grow by explaining ideas and building confidence.",s:"English, any subject you love",p:"Teaching degree or degree + PGCE → classroom placement → qualified teacher"}];
const HELP={Mathematics:"Work from the concrete (draw it) to the abstract (write the rule).",Science:"Link the idea to something observable, then name the scientific term.",English:"Read a short example, then rewrite it in your own words.",Geography:"Sketch a simple map or diagram and label the key features."};
const KEY="dreampath_demo_v1";let st,v="home",quiz=null;
const iso=d=>new Date(Date.now()+d*864e5).toISOString().slice(0,10);
const fresh=()=>({role:"teacher",a:[{id:1,t:"Fractions worksheet",s:"Mathematics",i:"Complete questions 1–10 and show working.",due:iso(3),done:false},{id:2,t:"Cell diagram",s:"Science",i:"Label the animal cell.",due:iso(5),done:true},{id:3,t:"Book summary",s:"English",i:"Write 120 words on your reader.",due:iso(7),done:false}],q:[],car:[],goal:""});
function load(){try{st=JSON.parse(localStorage.getItem(KEY))}catch(e){st=null}if(!st||!Array.isArray(st.a))st=fresh()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){toast("Could not save – browser storage is blocked.")}}
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function toast(m){const t=$("toast");t.textContent=m;t.className="on";clearTimeout(toast.h);toast.h=setTimeout(()=>t.className="",2600)}
function go(x){v=x;quiz=null;render();scrollTo(0,0)}
function setRole(r){st.role=r;save();v="dash";render()}
// ---- analytics
function topics(s){const o={};const names=new Set([...Object.keys(BASE[s]),...QZ[s].map(q=>q[0])]);
names.forEach(t=>{const p=[];if(BASE[s][t]!=null)p.push(BASE[s][t]);st.q.filter(r=>r.s===s&&r.r&&r.r[t]!=null).forEach(r=>p.push(r.r[t]*100));
o[t]={n:p.length,sc:p.length?Math.round(p.reduce((a,b)=>a+b,0)/p.length):null,base:BASE[s][t]!=null}});return o}
function subj(s){const x=Object.values(topics(s)).filter(t=>t.sc!=null);return x.length?Math.round(x.reduce((a,t)=>a+t.sc,0)/x.length):null}
const done=()=>st.a.filter(a=>a.done).length;
const bar=(l,p)=>`<div style="margin:8px 0"><div class="row"><span>${esc(l)}</span><b>${p==null?"No data yet":p+"%"}</b></div><div class="bar"><i style="width:${p||0}%"></i></div></div>`;
const progress=()=>SUBJ.map(s=>bar(s,subj(s))).join("");
function donut(){const p=st.a.length?Math.round(done()/st.a.length*100):0;return `<div class="donut" style="background:conic-gradient(var(--b) ${p*3.6}deg,var(--l) 0)"><span>${p}%</span></div><p class="muted" style="text-align:center">${done()} of ${st.a.length} assignments complete</p>`}
const fmt=d=>new Date(d+"T00:00").toLocaleDateString("en-ZA",{day:"numeric",month:"short"});
function alist(edit){if(!st.a.length)return `<div class="empty">No assignments yet. ${st.role==="teacher"?"Create the first one above.":"Your teacher hasn't set any work."}</div>`;
return [...st.a].sort((a,b)=>a.due.localeCompare(b.due)).map(a=>{const late=!a.done&&a.due<iso(0);return `<div class="item"><div class="row"><div><b>${esc(a.t)}</b> <span class="tag">${esc(a.s)}</span> <span class="tag ${a.done?"g":late?"w":""}">${a.done?"Complete":late?"Overdue":"Due "+fmt(a.due)}</span><div class="muted">${esc(a.i)}</div>${a.upd?`<div class="edited">Updated ${esc(a.upd)}</div>`:""}</div>
<div>${edit==="learner"?`<button class="btn sm ${a.done?"alt":""}" onclick="tog(${a.id})">${a.done?"Mark outstanding":"Mark complete"}</button>`:""}${edit==="teacher"?`<button class="btn sm alt" onclick="editA(${a.id})" aria-label="Edit ${esc(a.t)}">Edit</button> <button class="btn sm red" onclick="del(${a.id})">Delete</button>`:""}</div></div></div>`}).join("")}
function tog(id){const a=st.a.find(x=>x.id===id);a.done=!a.done;save();toast(a.done?"Marked complete":"Marked outstanding");render()}
function del(id){if(!confirm("Delete this assignment?"))return;st.a=st.a.filter(x=>x.id!==id);save();toast("Assignment deleted");render()}
let editId=null;
function editA(id){const a=st.a.find(x=>x.id===id);if(!a){toast("That assignment no longer exists.");render();return}
editId=id;$("es").innerHTML=SUBJ.map(s=>`<option${s===a.s?" selected":""}>${s}</option>`).join("");
$("et").value=a.t;$("ei").value=a.i;$("ed").value=a.due;$("eerr").textContent="";$("modal").className="on";$("et").focus()}
function closeM(){$("modal").className="";editId=null}
function saveEdit(e){e.preventDefault();const a=st.a.find(x=>x.id===editId);if(!a){closeM();toast("That assignment no longer exists.");render();return}
const t=$("et").value.trim(),s=$("es").value,i=$("ei").value.trim(),d=$("ed").value,er=$("eerr");
if(!t){er.textContent="Title is required.";return}if(!i){er.textContent="Instructions are required.";return}
if(!SUBJ.includes(s)){er.textContent="Choose a valid subject.";return}if(!d){er.textContent="Due date is required.";return}
if(d<iso(0)&&d!==a.due){er.textContent="Due date cannot be moved to a past date.";return}
a.t=t;a.s=s;a.i=i;a.due=d;a.upd=new Date().toLocaleDateString("en-ZA");save();closeM();toast("Assignment updated – learner and parent views refreshed");render()}
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&editId!==null)closeM()});
function addA(e){e.preventDefault();const f=e.target,t=f.t.value.trim(),i=f.i.value.trim(),d=f.d.value,s=f.s.value;
if(!t||!i||!d||!s){$("aerr").textContent="Please complete the title, subject, instructions and due date.";return}
if(d<iso(0)){$("aerr").textContent="Due date cannot be in the past.";return}
st.a.push({id:Date.now(),t,s,i,due:d,done:false});save();toast("Assignment created – visible to learner and parent");render()}
function qres(){return st.q.length?[...st.q].reverse().slice(0,6).map(r=>`<div class="item row"><span>${esc(r.s)} <span class="muted">${esc(r.date)}</span></span><b>${r.sc}/${r.tot}</b></div>`).join(""):`<div class="empty">No quiz results yet. Take a practice quiz from the learner view.</div>`}
// ---- quiz
function startQ(s){if(!s)return;quiz=s;render()}
function subQ(e){e.preventDefault();const qs=QZ[quiz];let sc=0,r={},out=[];
for(let i=0;i<qs.length;i++){const c=e.target.elements["q"+i].value;if(c===""){$("qerr").textContent="Answer every question before checking.";return}
const ok=+c===qs[i][3];if(ok)sc++;r[qs[i][0]]=ok?1:0;out.push(`<div class="${ok?"good":"bad"}">${ok?"✔":"✘"} ${esc(qs[i][1])}${ok?"":" – correct: "+esc(qs[i][2][qs[i][3]])}</div>`)}
st.q.push({s:quiz,sc,tot:qs.length,r,date:new Date().toLocaleDateString("en-ZA")});save();toast("Quiz saved: "+sc+"/"+qs.length);
const s=quiz;quiz=null;render();$("qout").innerHTML=`<div class="card"><h3>${esc(s)} result: ${sc}/${qs.length}</h3>${out.join("")}</div>`}
function quizBox(){if(!quiz)return `<label for="qs">Choose a subject</label><select id="qs" onchange="startQ(this.value)"><option value="">Select…</option>${SUBJ.map(s=>`<option>${s}</option>`).join("")}</select><div id="qout" style="margin-top:12px"></div>`;
return `<form onsubmit="subQ(event)" novalidate><h3>${esc(quiz)} practice quiz</h3>${QZ[quiz].map((q,i)=>`<div class="q"><b>${esc(q[1])}</b>${q[2].map((o,j)=>`<label><input type="radio" name="q${i}" value="${j}">${esc(o)}</label>`).join("")}<input type="hidden" name="q${i}" value=""></div>`).join("")}<div class="err" id="qerr"></div><button class="btn">Check answers</button> <button type="button" class="btn alt" onclick="startQ(null);quiz=null;render()">Cancel</button></form>`}
// ---- views
const V={};
V.home=()=>`<section class="hero"><h1>Every learner deserves the chance to dream bigger.</h1><p>DreamPath AI connects learners, parents and teachers so educational support continues beyond the classroom.</p><button class="btn" style="background:#fff;color:var(--n)" onclick="go('dash')">Explore the demo</button> <button class="btn alt" style="background:none;color:#fff;border-color:#fff" onclick="go('ready')">Try the readiness checker</button></section>
<div class="grid"><div class="card"><h3>The problem</h3><p>Many families can't see what's happening between lessons. Homework gets missed, weak topics go unnoticed, and children rarely connect school to their future.</p></div>
<div class="card"><h3>Our mission</h3><p>Keep every child supported at school and at home, and help them see where their learning could lead.</p></div>
<div class="card"><h3>The solution</h3><p>One shared space for assignments, progress, practice and career exploration – with transparent, rule-based guidance.</p></div></div>
<h2>How teachers, families and learners work together</h2><div class="grid"><div class="card"><span class="tag">Teacher</span><p>Sets assignments and shares feedback.</p></div><div class="card"><span class="tag">Learner</span><p>Completes work, practises quizzes, explores careers.</p></div><div class="card"><span class="tag">Parent/Guardian</span><p>Sees progress and gets practical tips for home.</p></div></div>
<h2>Key features</h2><div class="grid">${[["Role dashboards","Teacher, parent and learner views, no sign-up."],["Readiness checker","Rule-based revision plans explained by evidence."],["Study assistant","Demo guidance with explanations and practice."],["Career discovery","Save careers and set a learning goal."],["Progress charts","Live charts that update as work changes."]].map(f=>`<div class="card"><b>${f[0]}</b><p class="muted">${f[1]}</p></div>`).join("")}</div>
<div class="card"><b>Honesty note:</b> recommendations are <span class="tag w">rule-based demonstrations</span>, not trained machine learning. The study assistant is a <span class="tag w">template demo</span> with no live AI connected. All data is fictional.</div>`;
V.dash=()=>V[st.role]();
V.teacher=()=>`<h1>Teacher dashboard</h1><div class="grid"><div class="card"><h3>My classes</h3>${[["Class 7A","28 learners","Mathematics"],["Class 7B","26 learners","Science"],["Class 8A","30 learners","English, Geography"]].map(c=>`<div class="item row"><b>${c[0]}</b><span class="muted">${c[1]} · ${c[2]}</span></div>`).join("")}<p class="muted">Fictional class list. Featured learner: Amara (demo).</p></div>
<div class="card"><h3>Create assignment</h3><form onsubmit="addA(event)" novalidate><label for="t">Title</label><input id="t" name="t" maxlength="80"><label for="s">Subject</label><select id="s" name="s">${SUBJ.map(s=>`<option>${s}</option>`).join("")}</select><label for="i">Instructions</label><textarea id="i" name="i" rows="3"></textarea><label for="d">Due date</label><input type="date" id="d" name="d" min="${iso(0)}"><div class="err" id="aerr"></div><button class="btn">Save assignment</button></form></div></div>
<div class="card"><h3>Assigned work</h3>${alist("teacher")}</div><div class="card"><h3>Class snapshot (Amara)</h3>${progress()}</div>`;
V.learner=()=>`<h1>Hi Amara 👋 <span class="tag w">fictional learner</span></h1><div class="grid"><div class="card"><h3>My assignments</h3>${alist("learner")}</div><div class="card"><h3>Completion</h3>${donut()}</div></div>
<div class="grid"><div class="card"><h3>Subject progress</h3>${progress()}</div><div class="card"><h3>Teacher feedback</h3>${SUBJ.map(s=>`<div class="item"><b>${s}</b><div class="muted">${esc(FB[s])}</div></div>`).join("")}</div></div>
<div class="card"><h3>Practice quiz</h3>${quizBox()}</div><div class="card"><h3>Recent quiz results</h3>${qres()}</div>`;
V.parent=()=>{const out=st.a.filter(a=>!a.done);return `<h1>Parent/Guardian dashboard</h1><p class="muted">Following: Amara (fictional demo learner)</p><div class="grid"><div class="card"><h3>Assignments</h3>${alist("parent")}<p class="muted">${out.length} outstanding.</p></div><div class="card"><h3>Upcoming assessments</h3>${TESTS.map(t=>`<div class="item row"><span><b>${t[0]}</b><div class="muted">${t[1]}</div></span><span class="tag">in ${t[2]} days</span></div>`).join("")}</div></div>
<div class="grid"><div class="card"><h3>Subject progress</h3>${progress()}</div><div class="card"><h3>Quiz results</h3>${qres()}</div></div>
<div class="grid"><div class="card"><h3>Teacher comments</h3>${SUBJ.map(s=>`<div class="item"><b>${s}:</b> <span class="muted">${esc(FB[s])}</span></div>`).join("")}</div><div class="card"><h3>Supporting learning at home</h3><ul><li>Ask Amara to teach you one thing she learned today.</li><li>Set a calm 20-minute homework slot each evening.</li><li>${out.length?"Check the "+out.length+" outstanding task(s) together.":"Celebrate that all work is complete!"}</li><li>Use the Readiness Checker before tests.</li><li>Talk about careers she's curious about.</li></ul></div></div>`};
V.ready=()=>`<h1>AI Learning Readiness Checker</h1><div class="card"><span class="tag w">Rule-based demonstration – not a trained machine learning model</span><label for="rs">Subject / assessment</label><select id="rs"><option value="">Select…</option>${SUBJ.map(s=>`<option>${s}</option>`).join("")}${TESTS.map(t=>`<option value="${t[0].split(" ")[0]}">${t[0]}</option>`).join("")}</select><div class="err" id="rerr"></div><button class="btn" onclick="check()">Check readiness</button></div><div id="rout"></div>`;
function check(){const s=$("rs").value;if(!s){$("rerr").textContent="Choose a subject or assessment first.";return}$("rerr").textContent="";
const T=topics(s),all=Object.entries(T).filter(x=>x[1].sc!=null),nq=st.q.filter(r=>r.s===s).length;
if(all.length<2||(nq===0&&all.every(x=>!x[1].base&&x[1].n<1))){$("rout").innerHTML=`<div class="card"><h3>Not enough evidence for ${esc(s)}</h3><p>We have ${all.length} topic result(s) and ${nq} quiz(zes). An unsupported prediction would be misleading, so we recommend a <b>diagnostic quiz</b> first.</p><button class="btn" onclick="st.role='learner';v='dash';render();startQ('${s}')">Take the ${esc(s)} diagnostic quiz</button></div>`;return}
const str=all.filter(x=>x[1].sc>=70),weak=all.filter(x=>x[1].sc<70).sort((a,b)=>a[1].sc-b[1].sc),ov=subj(s);
const lvl=ov>=75?"On track":ov>=60?"Needs some focused revision":"Needs significant revision";
const plan=(weak.length?weak:all.slice(0,1)).slice(0,3).map((w,i)=>`<li><b>Day ${i*2+1}–${i*2+2}:</b> Revise ${esc(w[0])} (${w[1].sc}%) – 20 min notes, 10 min practice questions.</li>`).join("");
$("rout").innerHTML=`<div class="card"><h3>${esc(s)}: ${lvl} (${ov}%)</h3><p><b>Strengths:</b> ${str.length?str.map(x=>esc(x[0])+" "+x[1].sc+"%").join(", "):"none above 70% yet"}</p><p><b>Needs practice:</b> ${weak.length?weak.map(x=>esc(x[0])+" "+x[1].sc+"%").join(", "):"nothing below 70%"}</p><h3>Study plan</h3><ol>${plan}<li><b>Final day:</b> Mixed practice quiz, then review mistakes.</li></ol>
<h3>Evidence used</h3><ul>${all.map(x=>`<li>${esc(x[0])}: ${x[1].n} data point(s)${x[1].base?" (incl. sample class assessment)":""}</li>`).join("")}</ul><p class="muted">Rule: topics below 70% are flagged; overall is the average of topic scores (≥75 on track, ≥60 some revision).</p></div>`}
V.ai=()=>`<h1>AI Study Assistant</h1><div class="card"><span class="tag w">Demo response system – no live AI model connected</span><form onsubmit="ask(event)" novalidate><label for="as">Subject</label><select id="as">${SUBJ.map(s=>`<option>${s}</option>`).join("")}</select><label for="at">Topic</label><input id="at" maxlength="60" placeholder="e.g. Fractions"><label for="aq">Your question</label><textarea id="aq" rows="3" placeholder="e.g. Why do I need a common denominator?"></textarea><div class="err" id="aerr2"></div><button class="btn">Get guidance</button></form></div><div id="aout"></div>`;
function ask(e){e.preventDefault();const s=$("as").value,t=$("at").value.trim(),q=$("aq").value.trim();
if(!t||q.length<5){$("aerr2").textContent="Enter a topic and a question of at least 5 characters.";return}$("aerr2").textContent="";
$("aout").innerHTML=`<div class="card"><span class="tag w">Template-generated demo</span><h3>Explanation</h3><p>Let's unpack <b>${esc(t)}</b> in ${esc(s)} for your question: “${esc(q)}”. Start by stating what ${esc(t)} means in one sentence, then identify the single step that confuses you. ${esc(HELP[s])}</p><h3>Practice suggestions</h3><ul><li>Write three of your own examples about ${esc(t)}.</li><li>Explain it aloud to someone at home for two minutes.</li><li>Take the ${esc(s)} practice quiz and review any mistakes.</li></ul><h3>Follow-up questions</h3><ul><li>What would change if the numbers or details in ${esc(t)} were different?</li><li>Where might you meet ${esc(t)} outside school?</li><li>Which part would you ask your teacher about?</li></ul></div>`}
V.car=()=>`<h1>Dreams and Career Discovery</h1><div class="card"><span class="tag w">Sample careers for demonstration – not real job listings</span><form onsubmit="setGoal(event)" novalidate><label for="gl">My learning goal</label><input id="gl" maxlength="100" value="${esc(st.goal)}" placeholder="e.g. Reach 80% in Mathematics by December"><div class="err" id="gerr"></div><button class="btn">Save goal</button></form>${st.goal?`<p>🎯 <b>${esc(st.goal)}</b></p>`:""}</div>
<div class="grid">${CAR.map(c=>{const s=st.car.includes(c.id);return `<div class="card"><h3>${c.n}</h3><p>${c.d}</p><p class="muted"><b>School subjects:</b> ${c.s}<br><b>Pathway:</b> ${c.p}</p><button class="btn sm ${s?"alt":""}" onclick="sav('${c.id}')">${s?"✔ Saved – remove":"Save career"}</button></div>`}).join("")}</div>
<div class="card"><h3>Saved careers</h3>${st.car.length?st.car.map(i=>`<span class="tag">${CAR.find(c=>c.id===i).n}</span> `).join(""):`<div class="empty">Nothing saved yet. Save a career that sparks your curiosity.</div>`}</div>`;
function sav(id){st.car=st.car.includes(id)?st.car.filter(x=>x!==id):[...st.car,id];save();toast("Careers updated");render()}
function setGoal(e){e.preventDefault();const g=$("gl").value.trim();if(g.length<5){$("gerr").textContent="Write a goal of at least 5 characters.";return}st.goal=g;save();toast("Goal saved");render()}
V.prog=()=>`<h1>Progress visualisations</h1><p class="muted">Fictional sample data plus anything you create in this demo.</p><div class="grid"><div class="card"><h3>Subject performance</h3>${progress()}</div><div class="card"><h3>Assignment completion</h3>${donut()}</div></div><div class="card"><h3>Topic breakdown</h3>${SUBJ.map(s=>`<b>${s}</b>${Object.entries(topics(s)).map(x=>bar(x[0],x[1].sc)).join("")||""}`).join("")}</div><div class="card"><h3>Quiz history</h3>${qres()}</div>`;
function reset(){if(!confirm("Reset all demo data? Assignments, quiz results, careers and goal will be cleared."))return;st=fresh();save();quiz=null;v="home";render();toast("Demo data reset")}
const NAV=[["home","Home"],["dash","Dashboard"],["ready","Readiness"],["ai","Study Assistant"],["car","Careers"],["prog","Progress"]];
function render(){$("role").value=st.role;$("nav").innerHTML=NAV.map(n=>`<button class="${v===n[0]?"on":""}" onclick="go('${n[0]}')">${n[1]}</button>`).join("")+`<button onclick="reset()">Reset demo</button>`;$("main").innerHTML=V[v]()}
load();render();
</script></body></html>
